<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Catálogo</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#ffffff; --text:#1a1a1a; --muted:#6b6b70;
    --accent:#2563eb; --accent-text:#ffffff; --border:#e5e5e8; --danger:#dc2626; --ok:#16a34a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121214; --card:#1c1c1f; --text:#f2f2f3; --muted:#a1a1a6; --accent:#3b82f6; --accent-text:#0b0b0c; --border:#2c2c30; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{position:sticky;top:0;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:10}
  header h1{font-size:1.1rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .card h3{margin:0;font-size:1rem}
  .card .precio{font-weight:700;color:var(--accent);font-size:1.05rem}
  .card .cat{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .card p{margin:0;font-size:.85rem;color:var(--muted)}
  .badge{font-size:.72rem;padding:2px 8px;border-radius:999px;width:fit-content}
  .badge.ok{background:rgba(22,163,74,.15);color:var(--ok)}
  .badge.no{background:rgba(220,38,38,.15);color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 12px}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  button.ghost{background:transparent}
  button.danger{color:var(--danger);border-color:var(--danger)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  section.admin{margin-top:28px;padding-top:18px;border-top:1px dashed var(--border)}
  section.admin h2{font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px}
  .adminlist{display:flex;flex-direction:column;gap:8px}
  .adminrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.88rem}
  dialog{border:none;border-radius:14px;padding:0;width:min(420px,92vw);background:var(--card);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog form{padding:18px;display:flex;flex-direction:column;gap:10px}
  dialog h3{margin:0 0 4px}
  label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input,select,textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
  .rowbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}
  a.sheetlink{color:var(--accent);font-size:.85rem}
</style>
</head>
<body>

<header>
  <div>
    <h1>📱 Mi Catálogo</h1>
    <p>Tecnología y celulares</p>
  </div>
  <button class="ghost" onclick="toggleAdmin()">Modo administrador</button>
</header>

<main>
  <div id="catalog" class="grid"></div>

  <section class="admin" id="adminSection" style="display:none">
    <h2>Panel de administrador</h2>
    <label style="margin-bottom:12px">Clave de administrador
      <input type="password" id="claveInput" placeholder="Ingresa tu clave">
    </label>
    <div class="toolbar">
      <button class="primary" onclick="openDialog('dlgProducto')">+ Nuevo producto</button>
      <button onclick="openDialog('dlgVenta')">Registrar venta</button>
      <a class="sheetlink" id="sheetLink" href="#" target="_blank">Abrir hoja de ventas en Google Sheets ↗</a>
    </div>
    <div class="adminlist" id="adminProductList"></div>
  </section>
</main>

<dialog id="dlgProducto">
  <form onsubmit="return addProducto(event)">
    <h3>Nuevo producto</h3>
    <label>Nombre<input required name="nombre"></label>
    <label>Categoría<input name="categoria" placeholder="Ej. Celulares"></label>
    <label>Precio (COP)<input required type="number" min="0" step="1" name="precio"></label>
    <label>Stock<input required type="number" min="0" step="1" name="stock" value="1"></label>
    <label>Descripción<textarea name="descripcion" rows="3"></textarea></label>
    <div class="rowbtns">
      <button type="button" class="ghost" onclick="closeDialog('dlgProducto')">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgVenta">
  <form onsubmit="return registrarVenta(event)">
    <h3>Registrar venta</h3>
    <label>Producto<select required name="productoId" id="ventaProductoSelect"></select></label>
    <label>Cantidad<input required type="number" min="1" step="1" name="cantidad" value="1"></label>
    <label>Cliente (opcional)<input name="cliente" placeholder="Nombre o contacto"></label>
    <div class="rowbtns">
      <button type="button" class="ghost" onclick="closeDialog('dlgVenta')">Cancelar</button>
      <button type="submit" class="primary">Registrar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
// 🔧 PEGA AQUÍ los dos datos que te da la guía (INSTRUCCIONES.md):
const API_URL = 'https://script.google.com/macros/s/AKfycbxKJ08e9dGJCFPIxxnbVn8NBi1Nkbj8HoLNW4mDUFrDSG8-mpxWcxseRUY82vuij89s/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/13FDC2xsShWoSxzZpsbThOM7kkTDeoVnn4twXNV166MQ/edit?usp=sharing';

let PRODUCTOS = [];
document.getElementById('sheetLink').href = SHEET_URL;

const cop = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function cargarProductos(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    PRODUCTOS = data.productos || [];
  }catch(err){
    toast('No se pudo conectar con la hoja. Revisa API_URL.');
    PRODUCTOS = [];
  }
  render();
}

function render(){
  renderCatalog();
  renderAdminList();
  renderVentaSelect();
}

function renderCatalog(){
  const el = document.getElementById('catalog');
  if (!PRODUCTOS.length){
    el.innerHTML = '<div class="empty">Todavía no hay productos publicados.</div>';
    return;
  }
  el.innerHTML = PRODUCTOS.map(p => `
    <div class="card">
      ${p.categoria ? `<div class="cat">${esc(p.categoria)}</div>` : ''}
      <h3>${esc(p.nombre)}</h3>
      ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
      <div class="precio">${cop(p.precio)}</div>
      <div class="badge ${p.stock>0?'ok':'no'}">${p.stock>0 ? p.stock+' disponibles' : 'Agotado'}</div>
    </div>
  `).join('');
}

function renderAdminList(){
  const el = document.getElementById('adminProductList');
  el.innerHTML = PRODUCTOS.map(p => `
    <div class="adminrow">
      <span>${esc(p.nombre)} — ${cop(p.precio)} · stock ${p.stock}</span>
      <button class="danger" onclick="eliminarProducto('${p.id}')">Eliminar</button>
    </div>
  `).join('') || '<div class="empty">Agrega tu primer producto.</div>';
}

function renderVentaSelect(){
  const sel = document.getElementById('ventaProductoSelect');
  sel.innerHTML = PRODUCTOS.map(p => `<option value="${p.id}">${esc(p.nombre)} (${cop(p.precio)})</option>`).join('');
}

function openDialog(id){ document.getElementById(id).showModal(); }
function closeDialog(id){ document.getElementById(id).close(); }
function toggleAdmin(){
  const sec = document.getElementById('adminSection');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
}

function claveActual(){
  return document.getElementById('claveInput').value.trim();
}

async function llamarBackend(payload){
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  return res.json();
}

async function addProducto(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await llamarBackend({
    accion: 'agregarProducto',
    clave: claveActual(),
    nombre: f.get('nombre').trim(),
    categoria: f.get('categoria').trim(),
    precio: Number(f.get('precio')),
    stock: Number(f.get('stock')),
    descripcion: f.get('descripcion').trim()
  });
  if (r.error){ toast(r.error); return false; }
  e.target.reset();
  closeDialog('dlgProducto');
  toast('Producto agregado ✔');
  cargarProductos();
  return false;
}

async function eliminarProducto(id){
  if (!confirm('¿Eliminar este producto del catálogo?')) return;
  const r = await llamarBackend({ accion:'eliminarProducto', clave: claveActual(), id });
  if (r.error){ toast(r.error); return; }
  toast('Producto eliminado');
  cargarProductos();
}

async function registrarVenta(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const prod = PRODUCTOS.find(p => p.id === f.get('productoId'));
  if (!prod){ toast('Selecciona un producto válido'); return false; }
  const r = await llamarBackend({
    accion: 'registrarVenta',
    clave: claveActual(),
    productoId: prod.id,
    producto: prod.nombre,
    cantidad: Number(f.get('cantidad')),
    precioUnitario: prod.precio,
    cliente: f.get('cliente').trim()
  });
  if (r.error){ toast(r.error); return false; }
  e.target.reset();
  closeDialog('dlgVenta');
  toast('Venta registrada en tu Google Sheet ✔');
  cargarProductos();
  return false;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

cargarProductos();
</script>
</body>
</html>
